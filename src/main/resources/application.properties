spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/autoservisdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

server.port=${PORT:8080}
server.address=0.0.0.0

spring.mail.host=${AUTOSERVIS_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${AUTOSERVIS_SMTP_PORT:587}
spring.mail.username=${AUTOSERVIS_SMTP_USERNAME:}
spring.mail.password=${AUTOSERVIS_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${AUTOSERVIS_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${AUTOSERVIS_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${AUTOSERVIS_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
autoservis.mail.from=${AUTOSERVIS_SMTP_FROM:${AUTOSERVIS_SMTP_USERNAME:}}
