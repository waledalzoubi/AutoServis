<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç Düzenle</title>
</head>
<body>

<h1>🚗 Araç Düzenle</h1>

<form action="/arac-guncelle" method="post">

    <input type="hidden" name="id" th:value="${arac.id}">

    <p>
        <label>Plaka:</label><br>
        <input type="text" name="plaka" th:value="${arac.plaka}" required>
    </p>

    <p>
        <label>Marka:</label><br>
        <input type="text" name="marka" th:value="${arac.marka}" required>
    </p>

    <p>
        <label>Model:</label><br>
        <input type="text" name="model" th:value="${arac.model}" required>
    </p>

    <p>
        <label>Yıl:</label><br>
        <input type="number" name="yil" th:value="${arac.yil}" required>
    </p>

    <p>
        <label>Telefon:</label><br>
        <input type="text" name="telefon" th:value="${arac.telefon}" required>
    </p>

    <p>
        <label>Servis Durumu:</label><br>
        <select name="durum" required>
            <option value="Araç servise alındı"
                    th:selected="${arac.durum == 'Araç servise alındı'}">Araç servise alındı</option>
            <option value="Arıza tespiti yapılıyor"
                    th:selected="${arac.durum == 'Arıza tespiti yapılıyor'}">Arıza tespiti yapılıyor</option>
            <option value="Parça bekleniyor"
                    th:selected="${arac.durum == 'Parça bekleniyor'}">Parça bekleniyor</option>
            <option value="Onarım yapılıyor"
                    th:selected="${arac.durum == 'Onarım yapılıyor'}">Onarım yapılıyor</option>
            <option value="Test aşamasında"
                    th:selected="${arac.durum == 'Test aşamasında'}">Test aşamasında</option>
            <option value="Araç hazır"
                    th:selected="${arac.durum == 'Araç hazır'}">Araç hazır</option>
            <option value="Teslim edildi"
                    th:selected="${arac.durum == 'Teslim edildi'}">Teslim edildi</option>
        </select>
    </p>

    <button type="submit">💾 Güncelle</button>

</form>

<br>
<a href="/araclar">⬅ Araçlar Sayfasına Dön</a>

</body>
</html>
