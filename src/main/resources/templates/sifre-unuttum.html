<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <script defer src="/refresh-button.js?v=2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Şifre Sıfırlama - AutoServis</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: #f1f4f9; color: #172337; }
        main { width: 100%; max-width: 460px; padding: 28px; border-radius: 16px; background: white; box-shadow: 0 5px 25px #00000012; }
        h1 { margin-top: 0; text-align: center; font-size: 25px; }
        p { color: #64748b; line-height: 1.5; }
        label { display: block; margin: 17px 0 7px; font-weight: bold; }
        input, button { width: 100%; padding: 13px; border-radius: 8px; font-size: 16px; }
        input { border: 1px solid #cbd5e1; }
        button { margin-top: 18px; border: 0; background: #172337; color: white; cursor: pointer; }
        .notice { margin-top: 16px; padding: 12px; border-radius: 8px; background: #ecfdf5; color: #166534; }
        .error { margin-top: 16px; padding: 12px; border-radius: 8px; background: #fee2e2; color: #991b1b; }
        a { display: block; margin-top: 20px; text-align: center; color: #0d6efd; }
        hr { margin: 24px 0; border: 0; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
<main>
    <h1>Şifremi Unuttum</h1>
    <p>E-posta adresinize 6 haneli sıfırlama kodu gönderin. Kod 2 dakika geçerlidir.</p>

    <form action="/sifre-kodu-gonder" method="post" th:if="${kodIletildi != true}">
        <label for="kodEposta">E-posta adresi</label>
        <input id="kodEposta" name="eposta" type="email" maxlength="190" autocomplete="email"
               th:value="${eposta}" required>
        <button type="submit">Sıfırlama kodu gönder</button>
    </form>

    <div class="notice" th:if="${bilgi != null}" th:text="${bilgi}" role="status"></div>
    <div class="notice" th:if="${basarili != null}" th:text="${basarili}" role="status"></div>
    <div class="error" th:if="${hata != null}" th:text="${hata}" role="alert"></div>

    <div th:if="${kodIletildi == true}">
        <hr>
        <h2>Yeni parolanızı belirleyin</h2>
        <p>E-postanıza gelen 6 haneli kodu ve yeni parolanızı girin.</p>
        <form action="/sifre-yenile" method="post">
            <label for="yenileEposta">E-posta adresi</label>
            <input id="yenileEposta" name="eposta" type="email" maxlength="190"
                   autocomplete="email" th:value="${eposta}" required>
            <label for="kod">6 haneli kod</label>
            <input id="kod" name="kod" type="text" inputmode="numeric" pattern="[0-9]{6}"
                   minlength="6" maxlength="6" autocomplete="one-time-code" required>
            <label for="yeniParola">Yeni parola</label>
            <input id="yeniParola" name="yeniParola" type="password" minlength="8" maxlength="128"
                   autocomplete="new-password" required>
            <label for="parolaTekrar">Yeni parolayı tekrar girin</label>
            <input id="parolaTekrar" name="parolaTekrar" type="password" minlength="8" maxlength="128"
                   autocomplete="new-password" required>
            <button type="submit">Parolayı değiştir</button>
        </form>
    </div>

    <a href="/giris">Giriş sayfasına dön</a>
</main>
</body>
</html>
