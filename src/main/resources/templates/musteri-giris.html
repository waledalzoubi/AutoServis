<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f4f9">

    <title>Müşteri Araç Sorgulama - AutoServis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            color: #202938;
        }

        .kart {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo img { width: 78px; height: 78px; }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 26px;
        }

        .aciklama {
            margin-bottom: 28px;
            text-align: center;
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
            color: #202938;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        #sasiNumarasi {
            text-transform: uppercase;
            autocapitalize: characters;
        }

        .bilgi {
            margin-top: 7px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }

        button {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover {
            background: #157347;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .hata {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .alt-yazi {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .ana-sayfa {
            display: block;
            margin-top: 18px;
            padding: 8px;
            text-align: center;
            color: #0d6efd;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
                align-items: flex-start;
                padding-top: 30px;
            }

            .kart {
                padding: 24px 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#101820">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script defer src="/pwa-register.js"></script>
</head>

<body>

<div class="kart">

    <div class="logo"><img src="/icons/autoservis-512.png" alt="AutoServis"></div>

    <h1>AutoServis</h1>

    <p class="aciklama">
        Aracınızın servis bilgilerini görmek için şasi numaranızı
        ve servise kayıtlı telefon numaranızı girin.
    </p>

    <form id="sorgulamaFormu"
          th:action="@{/musteri-sorgula}"
          action="/musteri-sorgula"
          method="post"
          accept-charset="UTF-8">

        <label for="sasiNumarasi">Araç Şasi Numarası</label>

        <input
                type="text"
                id="sasiNumarasi"
                name="sasiNumarasi"
                placeholder="17 karakterli şasi numarası"
                minlength="17"
                maxlength="17"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                enterkeyhint="next"
                required>

        <div class="bilgi">
            Şasi numarası araç ruhsatında yer alır.
        </div>

        <label for="telefon">
            Servise Kayıtlı Telefon Numaranız
        </label>

        <input
                type="tel"
                id="telefon"
                name="telefon"
                placeholder="05XXXXXXXXX"
                inputmode="numeric"
                maxlength="13"
                minlength="10"
                autocomplete="off"
                enterkeyhint="go"
                required>

        <button id="sorgulaButonu" type="submit">
            🔍 Aracımı Sorgula
        </button>

    </form>

    <button type="button" data-install-app hidden style="width:100%;min-height:44px;margin-top:12px;border:1px solid #b79a67;border-radius:8px;background:#fff;color:#172337;font-weight:bold;cursor:pointer;">AutoServis'i Uygulama Olarak Yükle</button>

    <div class="hata"
         th:if="${hata != null}"
         th:text="${hata}"
         role="alert"
         aria-live="polite">
    </div>

    <a class="ana-sayfa" th:href="@{/}" href="/">
        ← Ana sayfaya dön
    </a>

    <div class="alt-yazi">
        AutoServis Araç Takip Sistemi
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const sasiInput = document.getElementById("sasiNumarasi");
        const telefonInput = document.getElementById("telefon");
        const form = document.getElementById("sorgulamaFormu");
        const buton = document.getElementById("sorgulaButonu");

        function sasiDuzenle() {
            sasiInput.value = sasiInput.value
                .toUpperCase()
                .replace(/[\s-]+/g, "")
                .replace(/[^A-HJ-NPR-Z0-9]/g, "")
                .slice(0, 17);
        }

        sasiInput.addEventListener("input", sasiDuzenle);
        sasiInput.addEventListener("change", sasiDuzenle);

        telefonInput.addEventListener("input", function () {
            telefonInput.value = telefonInput.value
                .replace(/\D/g, "")
                .slice(0, 13);
        });

        form.addEventListener("submit", function (event) {
            sasiDuzenle();

            telefonInput.value = telefonInput.value
                .replace(/\D/g, "")
                .slice(0, 13);

            if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(sasiInput.value)) {
                event.preventDefault();
                alert("Lütfen 17 karakterli geçerli bir şasi numarası girin.");
                sasiInput.focus();
                return;
            }

            if (telefonInput.value.replace(/\D/g, "").length < 10) {
                event.preventDefault();
                alert("Lütfen servise kayıtlı telefon numarasını girin.");
                telefonInput.focus();
                return;
            }

            buton.disabled = true;
            buton.textContent = "Sorgulanıyor...";
        });

    });
</script>

</body>
</html>
