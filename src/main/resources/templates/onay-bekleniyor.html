<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hesap Onayı Bekleniyor - OtoPulse</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:#f1f4f9;color:#172337}
        main{width:100%;max-width:500px;padding:30px;border-radius:16px;background:white;box-shadow:0 5px 25px #00000012}h1{text-align:center}p{line-height:1.55;color:#475569}
        .status{margin-top:18px;padding:14px;border-radius:9px;background:#eff6ff;color:#1e40af;line-height:1.5}.status.ok{background:#ecfdf5;color:#166534}.status.err{background:#fef3c7;color:#92400e}
        a{display:block;margin-top:18px;text-align:center;color:#0d6efd}
    </style>
    <script defer src="/refresh-button.js?v=2"></script>
    <script defer>
        let approvalPollTimer;
        async function refreshApprovalStatus() {
            const status = document.getElementById('approval-status');
            try {
                const response = await fetch('/hesap-onay-durumu', {
                    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: new URLSearchParams({kod: document.getElementById('status-code').value})
                });
                if (!response.ok) throw new Error('status');
                const result = await response.json();
                if (result.onaylandi) {
                    status.className = 'status ok';
                    status.textContent = 'Hesabınız onaylandı. Şimdi giriş yapabilirsiniz.';
                    document.getElementById('login-link').hidden = false;
                    clearInterval(approvalPollTimer);
                    return;
                }
                status.className = 'status';
                status.textContent = 'Yönetici onayı bekleniyor. Durumu bu sayfa otomatik yeniler; isterseniz sağ alttaki “Yenile” düğmesini kullanın.';
            } catch (error) {
                status.className = 'status err';
                status.textContent = 'Onay durumu şu an alınamadı. Sayfadan çıkmadan “Yenile” düğmesine tekrar basabilirsiniz.';
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            refreshApprovalStatus();
            approvalPollTimer = setInterval(refreshApprovalStatus, 12000);
        });
    </script>
</head>
<body data-refresh-mode="approval-status">
<main>
    <h1>Hesap Onayı Bekleniyor</h1>
    <p><strong th:text="${eposta}"></strong> hesabınız için istek yöneticiye gönderildi. Onay verildiğinde bu sayfa otomatik güncellenecek.</p>
    <div id="approval-status" class="status" role="status" aria-live="polite">Onay durumu kontrol ediliyor…</div>
    <input id="status-code" type="hidden" th:value="${durumKodu}">
    <a id="login-link" href="/giris" hidden>Giriş sayfasına git</a>
    <a href="/giris">Giriş sayfasına dön</a>
</main>
</body>
</html>
