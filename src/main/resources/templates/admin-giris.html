<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>İşletme Girişi - AutoServis</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: #f1f4f9; color: #172337; }
        main { width: 100%; max-width: 420px; padding: 30px; border-radius: 16px; background: white; box-shadow: 0 5px 25px #00000012; }
        h1 { margin-top: 0; text-align: center; }
        .brand-icon { display:block; width:82px; height:82px; margin:0 auto 14px; }
        p { color: #64748b; line-height: 1.5; }
        label { display: block; margin: 22px 0 8px; font-weight: bold; }
        input, button { width: 100%; padding: 13px; border-radius: 8px; font-size: 16px; }
        input { border: 1px solid #cbd5e1; }
        button { margin-top: 18px; border: 0; background: #172337; color: white; cursor: pointer; }
        .hata { padding: 12px; border-radius: 8px; background: #fee2e2; color: #991b1b; }
        .musteri { display: block; margin-top: 20px; text-align: center; color: #0d6efd; }
    </style>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#101820">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script defer src="/pwa-register.js"></script>
</head>
<body>
<main>
    <img class="brand-icon" src="/icons/autoservis-512.png" alt="AutoServis">
    <h1>İşletme Girişi</h1>
    <p>İşletme hesabınızla giriş yapın.</p>
    <form action="/giris-yap" method="post">
        <label for="eposta">E-posta</label>
        <input id="eposta" name="eposta" type="email" autocomplete="username" required autofocus>
        <label for="parola">Parola</label>
        <input id="parola" name="parola" type="password" autocomplete="current-password" required>
        <button type="submit">Giriş Yap</button>
    </form>
    <button type="button" data-install-app hidden>AutoServis'i Uygulama Olarak Yükle</button>
    <div class="hata" th:if="${hata != null}" th:text="${hata}" role="alert"></div>
    <a class="musteri" href="/kayit">İşletmem için hesap oluştur</a>
    <a class="musteri" href="/musteri">Müşteri araç sorgulama</a>
</main>
</body>
</html>
