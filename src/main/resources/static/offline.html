<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Bağlantı yok - AutoServis</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f1f4f9;color:#101820;font:16px Arial,sans-serif;text-align:center}
    main{max-width:420px;padding:32px;border-radius:18px;background:#fff;box-shadow:0 8px 32px #10243d18}
    img{width:80px;height:80px}h1{font-size:24px}p{color:#64748b;line-height:1.6}button{padding:12px 18px;border:0;border-radius:8px;background:#101820;color:#fff;font-size:16px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/autoservis-192.png" alt="AutoServis">
    <h1>İnternet bağlantısı yok</h1>
    <p>AutoServis, araç ve servis bilgilerini güvenli şekilde sunmak için internete bağlanmalıdır. Bağlantı geldiğinde tekrar deneyin.</p>
    <button onclick="location.reload()">Yeniden dene</button>
  </main>
</body>
</html>
